name: metadata_god
description: Plugin for retrieving and writing audio tags/metadata from audio files
version: 1.0.0
repository: https://github.com/KRTirtho/frb_plugins/tree/main/packages/metadata_god

platforms:
  ios:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  flutter_rust_bridge: 2.11.1
  uuid: ^4.5.1
  meta: ^1.15.0

dev_dependencies:
  ffigen: ^16.1.0
  lints: ^5.1.1
  test: ^1.25.15
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
